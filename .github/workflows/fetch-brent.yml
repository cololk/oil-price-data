name: Fetch Brent Oil Price

on:
  schedule:
    - cron: '0 1,9 * * *'  # 每天台灣時間 09:00 和 17:00
  workflow_dispatch:

concurrency:
  group: brent-price-main
  cancel-in-progress: false

jobs:
  fetch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Test fetcher offline
        run: python3 -m unittest discover -s tests -v

      - name: Fetch Brent price
        id: fetch
        run: python3 scripts/fetch_brent.py

      # Publish stale status even when fetching fails; the job still stays failed.
      - name: Commit data and fetch status
        if: ${{ !cancelled() && (steps.fetch.outcome == 'success' || steps.fetch.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for file in brent.json brent-status.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "update Brent quote and fetch status $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
